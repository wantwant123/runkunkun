name: Build Runkun

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package app
        run: bash scripts/package_app.sh release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runkun
          path: |
            .build/Runkun.zip
            .build/Runkun.dmg

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .build/Runkun.zip .build/Runkun.dmg --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
